name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://fixoly:fixoly@localhost:5432/fixoly_orders?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      JWT_EXPIRES_IN_SECONDS: 3600
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fixoly
          POSTGRES_PASSWORD: fixoly
          POSTGRES_DB: fixoly_orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixoly -d fixoly_orders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
